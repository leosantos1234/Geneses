services:
  - type: web
    name: genesis-panel-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Robo/Dockerfile.api
    dockerContext: ./Robo
    healthCheckPath: /api/ui/health
    envVars:
      - key: GENESIS_DATABASE_BACKEND
        value: postgres
      - key: GENESIS_DATABASE_URL
        fromDatabase:
          name: genesis-db
          property: connectionString
      - key: GENESIS_ADMIN_EMAIL
        sync: false
      - key: GENESIS_ADMIN_PASSWORD
        sync: false
      - key: GENESIS_AUTH_SECRET
        sync: false
      - key: UI_CORS_ORIGINS
        value: https://genesis-panel.onrender.com
      - key: GENESIS_REMOTE_WORKER_CONTROL
        value: "true"
      - key: GENESIS_ASSET_LIST
        value: BTC,ETH,BNB,SOL,XRP,AVAX
      - key: ACTIVE_EXCHANGE
        value: okx
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_API_PASSPHRASE
        sync: false
      - key: OKX_DEMO_TRADING
        value: "false"

  - type: web
    name: genesis-panel
    runtime: docker
    plan: starter
    dockerfilePath: ./Robo/ui/lovable_export/genesis-quant-terminal-main/Dockerfile
    dockerContext: ./Robo/ui/lovable_export/genesis-quant-terminal-main
    envVars:
      - key: VITE_API_BASE
        sync: false

  - type: worker
    name: genesis-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Robo/Dockerfile.worker
    dockerContext: ./Robo
    dockerCommand: python render_worker.py
    envVars:
      - key: GENESIS_DATABASE_BACKEND
        value: postgres
      - key: GENESIS_DATABASE_URL
        fromDatabase:
          name: genesis-db
          property: connectionString
      - key: ACTIVE_EXCHANGE
        value: okx
      - key: OKX_READ_ONLY
        value: "false"
      - key: OKX_DEMO_TRADING
        value: "false"
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_API_PASSPHRASE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: LSTM_API_URL
        sync: false
      - key: PAPER_MODE
        value: "false"
      - key: ENABLE_LIVE_TRADING
        value: "true"
      - key: ALLOW_EXCHANGE_WRITE
        value: "true"
      - key: ALLOW_MAINNET_TRADING
        value: "true"
      - key: ALLOW_MAINNET_FROM_ENVFILE
        value: "true"
      - key: GENESIS_LIVE_EXECUTION_AUTHORIZATION
        value: I_UNDERSTAND_REAL_TRADING
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SUPERVISOR_USER_ID
        sync: false
      - key: LOG_DB_CAPTURE_ALL
        value: "true"
      - key: LOG_DB_RETENTION_DAYS
        value: "7"
      - key: GENESIS_REMOTE_WORKER_CONTROL
        value: "true"
      - key: GENESIS_ASSET_LIST
        value: BTC,ETH,BNB,SOL,XRP,AVAX
      - key: MODO_VALIDACAO
        value: agressivo
      - key: INTERVAL
        value: "5"
      - key: PULLBACK_ENTRY_TIMEFRAME
        value: 1h
      - key: PULLBACK_STOP_ATR
        value: "1.8"
      - key: PULLBACK_TARGET_ATR
        value: "3.0"
      - key: PULLBACK_TRAILING_ATR
        value: "2.0"
      - key: PULLBACK_VOLUME_MIN_RATIO
        value: "0.8"
      - key: PULLBACK_COOLDOWN_CANDLES
        value: "3"
      - key: PULLBACK_COST_PER_TRADE
        value: "0.00095"
      - key: PULLBACK_LIVE_BALANCE_PCT
        value: "1.0"
      - key: PULLBACK_LIVE_MAX_NOTIONAL_USDT
        value: "50"
      - key: PULLBACK_LIVE_COMPLETE_TO_MINIMUM
        value: "1"
      - key: PULLBACK_ENABLED
        value: "1"
      - key: PULLBACK_HISTORICAL_BACKTEST_ENABLED
        value: "1"
      - key: PULLBACK_BACKTEST_PARITY
        value: "1"
      - key: PULLBACK_ALLOW_REGIME_4
        value: "1"
      - key: PULLBACK_LIVE_EXECUTOR_ENABLED
        value: "1"

databases:
  - name: genesis-db
    plan: basic-256mb
